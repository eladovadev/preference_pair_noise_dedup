[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eladovadev-preference_pair_noise_dedup"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出模型评测平台工程师·偏好数据的成对噪声上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "eladovadev" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://eladovadev.github.io"
Repository = "https://github.com/eladovadev/preference_pair_noise_dedup"
Issues = "https://github.com/eladovadev/preference_pair_noise_dedup/issues"

[project.scripts]
preference_pair_noise_dedup = "preference_pair_noise_dedup:main"

[tool.setuptools]
py-modules = ["preference_pair_noise_dedup"]
